<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>VisualVerse Studio - Bold. Creative. Cinematic.</title>
    <meta name="title" content="VisualVerse Studio - Bold. Creative. Cinematic." />
    <meta name="description" content="Professional photography, videography, and creative services. Bold. Creative. Cinematic." />
    
    <!-- Open Graph / Facebook -->
    <!-- IMPORTANT: Replace "your-site.netlify.app" with your actual Netlify domain -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-site.netlify.app/" />
    <meta property="og:title" content="VisualVerse Studio - Bold. Creative. Cinematic." />
    <meta property="og:description" content="Professional photography, videography, and creative services. Bold. Creative. Cinematic." />
    <!-- Using og-image.html - some services support HTML OG images. For better compatibility, generate a static PNG and update this URL -->
    <meta property="og:image" content="https://your-site.netlify.app/og-image.html" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/html" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-site.netlify.app/" />
    <meta property="twitter:title" content="VisualVerse Studio - Bold. Creative. Cinematic." />
    <meta property="twitter:description" content="Professional photography, videography, and creative services. Bold. Creative. Cinematic." />
    <meta property="twitter:image" content="https://your-site.netlify.app/og-image.html" />
  </head>
