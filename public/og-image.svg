<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2EB9DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(46, 185, 223, 0.2)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:rgba(46, 185, 223, 0.3);stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(46, 185, 223, 0);stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Glow effect -->
  <ellipse cx="600" cy="315" rx="300" ry="300" fill="url(#glow)" opacity="0.6"/>
  
  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.15"/>
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Logo text -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="140" font-weight="700" text-anchor="middle" fill="url(#textGradient)" dominant-baseline="middle" letter-spacing="-3">
      VisualVerse
    </text>
    
    <!-- Accent line -->
    <line x1="-50" y1="80" x2="50" y2="80" stroke="#2EB9DF" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Tagline -->
    <text x="0" y="130" font-family="Arial, sans-serif" font-size="42" font-weight="300" text-anchor="middle" fill="#cbd5e1" dominant-baseline="middle" letter-spacing="3">
      Bold. Creative. Cinematic.
    </text>
  </g>
</svg>

