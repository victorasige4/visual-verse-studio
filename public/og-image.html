    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }
        /* Boxes pattern background matching hero section */
        .boxes-container {
            position: absolute;
            inset: 0;
            transform: translate(-40%, -60%) skewX(-48deg) skewY(14deg) scale(0.675) rotate(0deg);
            opacity: 0.3;
        }
        .box-row {
            display: flex;
            height: 32px;
        }
        .box {
            width: 64px;
            height: 32px;
            border: 1px solid rgba(51, 65, 85, 0.5);
            position: relative;
        }
        .box:nth-child(even)::before {
            content: '+';
            position: absolute;
            top: -14px;
            left: -22px;
            color: rgba(51, 65, 85, 0.5);
            font-size: 20px;
        }
        /* Radial gradient mask */
        .mask-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 0%, #0f172a 70%);
            z-index: 1;
        }
        .content {
            text-align: center;
            z-index: 10;
            position: relative;
        }
        h1 {
            font-size: 120px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #2dd4bf 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        .tagline {
            font-size: 36px;
            color: #cbd5e1;
            font-weight: 300;
            letter-spacing: 2px;
        }
        /* Accent glows */
        .accent-box {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, rgba(45, 212, 191, 0.15), rgba(6, 182, 212, 0.15));
            border-radius: 20px;
            filter: blur(80px);
            z-index: 0;
        }
        .box-1 {
            top: -150px;
            right: -100px;
        }
        .box-2 {
            bottom: -150px;
            left: -100px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
